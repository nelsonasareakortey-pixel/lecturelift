<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LectureLift — Study Notes Demo</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main class="shell">
    <header class="hero">
      <p class="eyebrow">LEARN SMARTER</p>
      <h1>Lecture<span>Lift</span></h1>
      <p>Turn a YouTube transcript into detailed, structured study notes.</p>
    </header>

    <section class="panel">
      <label for="transcript">Video transcript</label>
      <textarea id="transcript" rows="9" placeholder="Paste the transcript from your existing YouTube transcript extractor here…"></textarea>
      <div class="controls">
        <label>Education level
          <select id="educationLevel">
            <option>general student</option>
            <option>high school</option>
            <option>university</option>
            <option>professional</option>
          </select>
        </label>
        <label>Detail level
          <select id="detailLevel">
            <option>comprehensive</option>
            <option>very detailed</option>
            <option>concise</option>
          </select>
        </label>
      </div>
      <button id="generate">Generate detailed notes</button>
      <p id="status" role="status" aria-live="polite"></p>
    </section>

    <section id="results" class="results" hidden>
      <div id="notes"></div>
    </section>
    <footer>LectureLift starter demo · Add your existing transcript extraction before deploying.</footer>
  </main>
  <script src="/script.js"></script>
</body>
</html>
